<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PolySync</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="PolySync 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>PolySync</span>
      </a>
      <div class="top-actions">
        <span class="service-state"><i></i>服务在线</span>
        <button class="button primary" id="add-share">添加同步</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">局域网文件同步</p>
          <h1>文件，在设备间自然流动。</h1>
          <p class="hero-copy">端到端直连，不经过云端。在线时自动同步，也可以随时手动触发。</p>
        </div>
        <div class="device-card" id="device-card">
          <div class="skeleton wide"></div><div class="skeleton"></div>
        </div>
      </section>

      <section class="section-head">
        <div>
          <p class="eyebrow">同步空间</p>
          <h2>我的文件夹</h2>
        </div>
        <span class="muted" id="share-count"></span>
      </section>

      <section class="share-grid" id="share-list" aria-live="polite">
        <div class="loading-card"><div class="skeleton wide"></div><div class="skeleton"></div></div>
      </section>

      <section class="activity-section" id="activity-section">
        <div class="section-head compact">
          <div><p class="eyebrow">最近动态</p><h2>同步记录</h2></div>
        </div>
        <div class="activity-list" id="activity-list"></div>
      </section>
    </main>

    <footer>
      <span>PolySync Protocol v1</span>
      <span>TCP 直连 · SHA-256 校验</span>
    </footer>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="icon-button close" id="close-modal" aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
