name: Release

on:
  push:
    tags: ['v*', 'build-check/**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME##*/}
          if [[ ! $tag =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$ ]]; then exit 1; fi
          (( BASH_REMATCH[1] <= 255 && BASH_REMATCH[2] <= 255 && BASH_REMATCH[3] <= 65535 ))
          test -s "docs/release-$tag.md"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.number }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: dotnet tool install wix --tool-path .cache/wix4 --version 4.0.6
      - run: ./scripts/build.ps1 -Version $env:VERSION
      - name: Verify updater and installation lifecycle
        shell: pwsh
        env:
          POLYSYNC_MSI_OLD_BINARY: .cache/original-v0.4.0.exe
          POLYSYNC_MSI_NEW_BINARY: dist/polysync-windows-amd64.exe
          POLYSYNC_MSI_NEW_VERSION: ${{ needs.version.outputs.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/Leoforever123/Polysync/releases/download/v0.4.0/polysync-windows-amd64.exe' -OutFile $env:POLYSYNC_MSI_OLD_BINARY
          if ((Get-FileHash $env:POLYSYNC_MSI_OLD_BINARY).Hash -ne 'f6fded0752495639049a9552de9aabcd08d1cdfdd2bd7b0358f778c9b59a8660') { throw 'Old binary checksum mismatch' }
          node tests/msi.integration.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/polysync-*
          if-no-files-found: error

  deb:
    runs-on: ubuntu-latest
    needs: [version, desktop]
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist
      - run: python3 scripts/package-linux.py --version "$VERSION" --format deb --output-dir packages
      - run: cd packages && sha256sum -c SHA256SUMS-*.txt && dpkg-deb --info ./*amd64.deb && dpkg-deb --info ./*arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    needs: [version, desktop]
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist
      - name: Build with the Arch package manager
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e VERSION -e HOST_UID="$(id -u)" archlinux:base-devel bash -euc '
            pacman -Syu --needed --noconfirm python
            useradd --non-unique -u "$HOST_UID" --create-home builder
            runuser -u builder -- python scripts/package-linux.py --version "$VERSION" --format arch --output-dir packages
          '
          (cd packages && sha256sum -c SHA256SUMS-*.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packages/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [version, deb, arch]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: inputs
      - name: Assemble and verify published files
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          cp LICENSE assets/LICENSE.txt
          cp THIRD_PARTY_NOTICES.txt assets/
          for file in polysync-windows-amd64.{exe,msi} polysync-{darwin,linux}-{amd64,arm64}; do
            install -m 644 "inputs/desktop/$file" "assets/$file"
          done
          cp inputs/deb/*.deb inputs/arch/*.pkg.tar.zst inputs/arch/*-arch-build.tar.gz assets/
          cat inputs/{deb,arch}/SHA256SUMS-*.txt > "assets/SHA256SUMS-linux-$VERSION-1-all.txt"
          pointer="packaging/android/preview-v$VERSION.lfs"
          if [[ -f "$pointer" ]]; then
            apk=assets/polysync-android-arm64-preview.apk
            git lfs smudge < "$pointer" > "$apk"
            digest=$(sed -n 's/^oid sha256://p' "$pointer")
            echo "$digest  $apk" | sha256sum -c -
            signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$signer" verify "$apk"
          fi
          cd assets
          sha256sum -c "SHA256SUMS-linux-$VERSION-1-all.txt"
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish release after all checks
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "PolySync $GITHUB_REF_NAME" --notes-file "docs/release-$GITHUB_REF_NAME.md"
