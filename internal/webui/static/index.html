<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PolySync</title>
  <link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/transfer.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="PolySync 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>PolySync</span>
      </a>
      <div class="top-actions">
        <span class="service-state"><i></i>服务在线</span>
        <button class="button ghost" id="add-device">添加设备</button>
        <button class="button primary" id="add-share" hidden>添加同步</button>
      </div>
    </header>

    <nav class="workspace-nav" id="workspace-nav" aria-label="工作空间">
      <div><button data-workspace="sync" aria-current="true">同步</button><button data-workspace="transfer" aria-current="false">随传 <span aria-hidden="true">↗</span></button></div>
      <button class="button ghost small" id="help-tour" hidden>使用引导</button>
    </nav>
    <aside class="tour-invite" id="tour-invite" hidden><div><strong>第一次使用 PolySync？</strong><p>一分钟了解设备配对和文件夹同步。</p></div><div><button class="button ghost small" id="tour-dismiss">以后再说</button><button class="button primary small" id="tour-start">带我看看</button></div></aside>
    <main>
    <div id="sync-workspace">
      <section class="hero">
        <div>
          <h1>文件夹同步</h1>
          <p class="hero-copy">查看本机文件夹与其他设备的同步情况。</p>
          <p class="background-note" id="background-note"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg><span>关闭页面后继续同步，可从系统托盘打开或退出。</span></p>
        </div>
        <div class="device-card" id="device-card">
          <div class="skeleton wide"></div><div class="skeleton"></div>
        </div>
      </section>

      <section class="attention-list" id="attention-list"></section>

      <section class="section-head">
        <div>
          <h2>我的文件夹</h2>
        </div>
        <span class="muted" id="share-count"></span>
      </section>

      <section class="share-grid" id="share-list">
        <div class="loading-card"><div class="skeleton wide"></div><div class="skeleton"></div></div>
      </section>

      <button class="button ghost small" id="share-more" hidden>显示更多文件夹</button>
      <section class="section-head">
        <div>
          <h2>设备</h2>
        </div>
        <span class="muted" id="device-count"></span>
      </section>
      <section class="device-grid" id="device-list"></section>

      <section class="conflict-section hidden" id="conflict-section">
        <div class="section-head compact">
          <div><h2>文件冲突</h2></div>
          <span class="muted" id="conflict-count"></span>
        </div>
        <div class="conflict-list" id="conflict-list"></div>
      </section>

      <section class="activity-section" id="activity-section" hidden>
        <div class="section-head compact">
          <div><h2>同步记录</h2></div>
        </div>
        <div class="activity-list" id="activity-list"></div>
      </section>
    </div>
    <section id="transfer-workspace" hidden aria-labelledby="transfer-title">
      <div class="transfer-heading"><div><h1 id="transfer-title">随传</h1><p class="hero-copy">向已配对的设备发送文件，或查看收到的文件。</p></div></div>
      <div class="transfer-settings-bar"><div><strong id="transfer-receive-status">正在读取接收状态…</strong><small id="transfer-directory-note"></small></div><button class="button ghost small" id="transfer-settings">随传设置</button></div>
      <p id="transfer-connection-error" class="transfer-message" role="status" hidden></p>
      <div class="transfer-compose">
        <div><p class="eyebrow">发送文件</p><label class="transfer-drop" id="transfer-drop"><span class="transfer-drop-mark" aria-hidden="true">＋</span><strong>把文件拖到这里</strong><span>或点击选择文件 · 支持多选</span><input id="transfer-files" type="file" multiple aria-label="选择要发送的文件"></label><ul class="transfer-selection" id="transfer-selection"></ul></div>
        <div class="transfer-destination"><label for="transfer-peer">接收设备</label><select class="select" id="transfer-peer"><option value="">选择接收设备</option></select><p class="muted" id="transfer-peer-note"></p><button class="button primary" id="transfer-send" disabled>发送文件 <span aria-hidden="true">↗</span></button><button class="button ghost small" id="transfer-upload-cancel" hidden>取消上传</button><p class="muted" id="transfer-upload-note" role="status">每批最多 128 个普通文件，共 16 GiB。文件夹请先打包。</p></div>
      </div>
      <div class="section-head"><div><h2>接收与发送</h2></div><span class="muted">文件会保留，直到你主动清理</span></div>
      <div id="transfer-list"></div><button class="button ghost small" id="transfer-more" hidden>显示更多记录</button>
    </section>
    </main>

    <footer>
      <button class="button ghost small" id="open-update">版本与更新</button>
    </footer>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="icon-button close" id="close-modal" aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </section>
  </div>

  <div id="tour-layer" hidden>
    <div id="tour-spotlight" aria-hidden="true"></div>
    <section id="tour-bubble" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-copy">
      <div class="tour-top"><span id="tour-count" class="eyebrow"></span><button class="button ghost small" id="tour-skip">跳过</button></div>
      <h2 id="tour-title"></h2><p id="tour-copy"></p>
      <div class="tour-actions"><button class="button ghost" id="tour-prev">上一步</button><button class="button primary" id="tour-next">下一步</button></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
  <script src="/transfer.js" defer></script>
  <script src="/tour.js" defer></script>
  <script src="/update.js" defer></script>
</body>
</html>
